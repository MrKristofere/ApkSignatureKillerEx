name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platforms;android-32
            build-tools;32.0.0
            ndk;24.0.8215888
            cmake;3.22.1

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Show versions
        run: |
          java -version
          ./gradlew --version
          sdkmanager --version

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: List APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ApkSignatureKillerEx-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
